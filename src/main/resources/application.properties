quarkus.application.name=loan-origination-platform
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}
quarkus.http.limits.max-body-size=1M
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."Referrer-Policy".value=no-referrer

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:loan_app}
quarkus.datasource.password=${DB_PASSWORD:loan_app}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5433/loan_origination}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX_SIZE:10}
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.datasource.health.enabled=true

quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.connect-retries=5
quarkus.flyway.connect-retries-interval=2s
%test.quarkus.scheduler.enabled=false

quarkus.oidc.application-type=service
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
quarkus.http.auth.permission.health.paths=/q/health/*
quarkus.http.auth.permission.health.policy=permit
quarkus.http.auth.permission.metrics.paths=/q/metrics
quarkus.http.auth.permission.metrics.policy=authenticated
%dev.quarkus.http.auth.permission.metrics.policy=permit
%test.quarkus.http.auth.permission.metrics.policy=permit
quarkus.http.auth.permission.docs.paths=/q/openapi,/q/swagger-ui/*
quarkus.http.auth.permission.docs.policy=permit

%dev.quarkus.keycloak.devservices.users.customer=customer
%dev.quarkus.keycloak.devservices.roles.customer=CUSTOMER
%dev.quarkus.keycloak.devservices.users.loan-officer=loan-officer
%dev.quarkus.keycloak.devservices.roles.loan-officer=LOAN_OFFICER
%dev.quarkus.keycloak.devservices.users.auditor=auditor
%dev.quarkus.keycloak.devservices.roles.auditor=AUDITOR
%dev.quarkus.keycloak.devservices.users.admin=admin
%dev.quarkus.keycloak.devservices.roles.admin=ADMIN

quarkus.smallrye-openapi.info-title=Loan Origination Platform API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Contrato público v1 de originación y administración de préstamos.
%dev.quarkus.swagger-ui.always-include=true
%prod.quarkus.swagger-ui.always-include=false

quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=metrics
quarkus.micrometer.binder.http-server.enabled=true

# Se generan spans HTTP/JDBC y se propagan contextos; OTLP es optativo para que dev/local no dependa de un collector.
quarkus.otel.enabled=true
quarkus.otel.service.name=${OTEL_SERVICE_NAME:loan-origination-platform}
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=${OTEL_TRACES_SAMPLER_ARG:1.0}
%prod.quarkus.otel.traces.sampler.arg=${OTEL_TRACES_SAMPLER_ARG:0.1}
quarkus.otel.exporter.otlp.enabled=${OTEL_EXPORTER_OTLP_ENABLED:false}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
%dev.quarkus.otel.exporter.otlp.enabled=false
%dev.quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
%test.quarkus.otel.exporter.otlp.enabled=false
%dev.quarkus.observability.lgtm.enabled=false

quarkus.log.level=INFO
quarkus.log.category."com.loanorigination".level=INFO
%dev.quarkus.log.category."com.loanorigination".level=DEBUG
%prod.quarkus.log.console.json.enabled=true
%prod.quarkus.log.console.json.mdc.flat-fields=true
%prod.quarkus.log.console.json.additional-field.service.value=loan-origination-platform
%prod.quarkus.hibernate-orm.log.sql=false
%prod.quarkus.log.category."org.hibernate.SQL".level=WARN
%prod.quarkus.log.category."org.hibernate.orm.jdbc.bind".level=OFF
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

quarkus.application.name=loan-origination-platform
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}
quarkus.http.limits.max-body-size=1M
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."Referrer-Policy".value=no-referrer

# CORS admite el origen configurado del cliente; en producción se define en Railway.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGIN:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Idempotency-Key,X-Correlation-ID
quarkus.http.cors.exposed-headers=X-Correlation-ID
quarkus.http.cors.access-control-allow-credentials=false
%prod.quarkus.http.cors.origins=${FRONTEND_ORIGIN}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:loan_app}
quarkus.datasource.password=${DB_PASSWORD:loan_app}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5433/loan_origination}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX_SIZE:10}
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.datasource.health.enabled=true

quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.connect-retries=5
quarkus.flyway.connect-retries-interval=2s
%test.quarkus.scheduler.enabled=false

quarkus.oidc.application-type=service
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
quarkus.http.auth.permission.health.paths=/q/health/*
quarkus.http.auth.permission.health.policy=permit
quarkus.http.auth.permission.metrics.paths=/q/metrics
quarkus.http.auth.permission.metrics.policy=authenticated
%dev.quarkus.http.auth.permission.metrics.policy=permit
%test.quarkus.http.auth.permission.metrics.policy=permit
quarkus.http.auth.permission.docs.paths=/q/openapi,/q/swagger-ui/*
quarkus.http.auth.permission.docs.policy=permit



quarkus.smallrye-openapi.info-title=Loan Origination Platform API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Contrato público v1 de originación y administración de préstamos.
%dev.quarkus.swagger-ui.always-include=true
%prod.quarkus.swagger-ui.always-include=false

quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=metrics
quarkus.micrometer.binder.http-server.enabled=true

# Se generan spans HTTP/JDBC y se propagan contextos; OTLP es optativo para que dev/local no dependa de un collector.
quarkus.otel.enabled=true
quarkus.otel.service.name=${OTEL_SERVICE_NAME:loan-origination-platform}
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=${OTEL_TRACES_SAMPLER_ARG:1.0}
%prod.quarkus.otel.traces.sampler.arg=${OTEL_TRACES_SAMPLER_ARG:0.1}
quarkus.otel.exporter.otlp.enabled=${OTEL_EXPORTER_OTLP_ENABLED:false}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
%dev.quarkus.otel.exporter.otlp.enabled=false
%dev.quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
%test.quarkus.otel.exporter.otlp.enabled=false
%dev.quarkus.observability.lgtm.enabled=false

quarkus.log.level=INFO
quarkus.log.category."com.loanorigination".level=INFO
%dev.quarkus.log.category."com.loanorigination".level=DEBUG
%prod.quarkus.log.console.json.enabled=true
%prod.quarkus.log.console.json.mdc.flat-fields=true
%prod.quarkus.log.console.json.additional-field.service.value=loan-origination-platform
%prod.quarkus.hibernate-orm.log.sql=false
%prod.quarkus.log.category."org.hibernate.SQL".level=WARN
%prod.quarkus.log.category."org.hibernate.orm.jdbc.bind".level=OFF
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

# Keycloak estable para el entorno local de desarrollo.
# Keycloak local reproducible para desarrollo.
%dev.quarkus.keycloak.devservices.enabled=true
%dev.quarkus.keycloak.devservices.port=8180
%dev.quarkus.keycloak.devservices.realm-path=keycloak/loan-origination-realm.json
app.risk.mode=${RISK_ASSESSMENT_MODE:LOCAL}
mp.messaging.outgoing.risk-assessment-requests.connector=smallrye-kafka
mp.messaging.outgoing.risk-assessment-requests.topic=loan.risk-assessment.requested.v2
mp.messaging.outgoing.risk-assessment-requests.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.risk-assessment-requests.enabled=${RISK_KAFKA_ENABLED:false}
mp.messaging.incoming.credit-risk-results.connector=smallrye-kafka
mp.messaging.incoming.credit-risk-results.topic=credit-risk.assessment.completed.v2
mp.messaging.incoming.credit-risk-results.group.id=loan-origination-platform
mp.messaging.incoming.credit-risk-results.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.credit-risk-results.failure-strategy=dead-letter-queue
mp.messaging.incoming.credit-risk-results.dead-letter-queue.topic=credit-risk.assessment.completed.v2.DLQ
mp.messaging.incoming.credit-risk-results.enabled=${RISK_KAFKA_ENABLED:false}
%test.mp.messaging.outgoing.risk-assessment-requests.enabled=false
%test.mp.messaging.incoming.credit-risk-results.enabled=false

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
app.fraud.mode=${FRAUD_ASSESSMENT_MODE:LOCAL}
mp.messaging.outgoing.fraud-assessment-requests.connector=smallrye-kafka
mp.messaging.outgoing.fraud-assessment-requests.topic=loan.fraud-assessment.requested.v1
mp.messaging.outgoing.fraud-assessment-requests.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.fraud-assessment-requests.enabled=${FRAUD_KAFKA_ENABLED:false}
mp.messaging.incoming.fraud-assessment-results.connector=smallrye-kafka
mp.messaging.incoming.fraud-assessment-results.topic=fraud.assessment.completed.v1
mp.messaging.incoming.fraud-assessment-results.group.id=loan-origination-platform
mp.messaging.incoming.fraud-assessment-results.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.fraud-assessment-results.failure-strategy=dead-letter-queue
mp.messaging.incoming.fraud-assessment-results.dead-letter-queue.topic=fraud.assessment.completed.v1.DLQ
mp.messaging.incoming.fraud-assessment-results.enabled=${FRAUD_KAFKA_ENABLED:false}
%test.mp.messaging.outgoing.fraud-assessment-requests.enabled=false
%test.mp.messaging.incoming.fraud-assessment-results.enabled=false


%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
%prod.app.risk.mode=${RISK_ASSESSMENT_MODE:KAFKA}
%prod.app.fraud.mode=${FRAUD_ASSESSMENT_MODE:KAFKA}
%prod.mp.messaging.outgoing.risk-assessment-requests.enabled=${RISK_KAFKA_ENABLED:true}
%prod.mp.messaging.incoming.credit-risk-results.enabled=${RISK_KAFKA_ENABLED:true}
%prod.mp.messaging.outgoing.fraud-assessment-requests.enabled=${FRAUD_KAFKA_ENABLED:true}
%prod.mp.messaging.incoming.fraud-assessment-results.enabled=${FRAUD_KAFKA_ENABLED:true}

mp.messaging.incoming.fraud-case-resolutions.connector=smallrye-kafka
mp.messaging.incoming.fraud-case-resolutions.topic=fraud.case.resolved.v1
mp.messaging.incoming.fraud-case-resolutions.group.id=loan-origination-platform
mp.messaging.incoming.fraud-case-resolutions.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.fraud-case-resolutions.failure-strategy=dead-letter-queue
mp.messaging.incoming.fraud-case-resolutions.dead-letter-queue.topic=fraud.case.resolved.v1.DLQ
mp.messaging.incoming.fraud-case-resolutions.enabled=${FRAUD_KAFKA_ENABLED:false}
%test.mp.messaging.incoming.fraud-case-resolutions.enabled=false
%prod.mp.messaging.incoming.fraud-case-resolutions.enabled=${FRAUD_KAFKA_ENABLED:true}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:loan_app}
quarkus.datasource.password=${DB_PASSWORD:loan_app}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5433/loan_origination}

quarkus.hibernate-orm.database.generation=validate

quarkus.flyway.migrate-at-start=true
%test.quarkus.scheduler.enabled=false

quarkus.oidc.application-type=service

# En producción la URL del Identity Provider llegará por variable de entorno.
# En dev NO definimos auth-server-url para que Quarkus pueda usar OIDC Dev Services.
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}

# Todos los endpoints de nuestra API requieren autenticación.
# Las anotaciones @RolesAllowed de cada recurso determinarán además
# qué roles pueden realizar cada operación.
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated

# Usuarios de desarrollo creados automáticamente por Keycloak Dev Services.
%dev.quarkus.keycloak.devservices.users.customer=customer
%dev.quarkus.keycloak.devservices.roles.customer=CUSTOMER

%dev.quarkus.keycloak.devservices.users.loan-officer=loan-officer
%dev.quarkus.keycloak.devservices.roles.loan-officer=LOAN_OFFICER

%dev.quarkus.keycloak.devservices.users.auditor=auditor
%dev.quarkus.keycloak.devservices.roles.auditor=AUDITOR

%dev.quarkus.keycloak.devservices.users.admin=admin
%dev.quarkus.keycloak.devservices.roles.admin=ADMIN
